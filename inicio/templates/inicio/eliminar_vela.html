
{% extends "base.html"%}

{%block title%}
<h1>{{vela}}</h1>
{% endblock title%}

{%block content_title%}
Eliminar vela
{% endblock content_title%}

{%block content%}
<form method="POST" action="{% url 'eliminar_vela' vela.id%}">
    {% csrf_token %}
    <p>¿Está seguro de que desea eliminar la vela "{{ vela.nombre }}"?</p>
    <input type="submit" value="Confirmar eliminación">
    {{ form}}
</form>
{% endblock content%}
