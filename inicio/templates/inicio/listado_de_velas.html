<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <nav>
        <ul>
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'crear_vela' %}">Crear vela</a>
            <a href="{% url 'listado_de_velas' %}">Listado de velas</a>
            
        </ul>
    </nav>
    <h1 class="text-center text-primary my-4">Listado de velas</h1>

<div class="container">
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    {% for vela in velas %}
    <div class="col">
    <div class="card h-100 shadow-sm">
        <div class="card-body">
        <h5 class="card-title">{{ vela.nombre }}</h5>
        <p class="card-text"><strong>Aroma:</strong> {{ vela.aroma }}</p>
        <p class="card-text"><strong>Color:</strong> {{ vela.color }}</p>
        <p class="card-text"><strong>Precio:</strong> ${{ vela.precio }}</p>
        </div>
    </div>
    </div>
    {% endfor %}
</div>
</div>
    
</body>
</html>
